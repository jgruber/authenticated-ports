[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authenticated-ports"
version = "0.1.0"
description = "Self-hosted authenticated on-demand port forwarding via UPnP IGD (pluggable backend)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "John Gruber" }]
dependencies = []

[project.optional-dependencies]
upnp = ["miniupnpc>=2.2.6"]
web = [
  "Flask>=3.0",
  "Flask-WTF>=1.2",
  "Flask-Limiter>=3.5",
  "argon2-cffi>=23.1",
  "PyYAML>=6.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
authenticated-ports = "authenticated_ports.cli:main"
upnp-probe = "probe.upnp_probe:main"

[tool.setuptools.packages.find]
include = ["authenticated_ports*", "probe*"]
