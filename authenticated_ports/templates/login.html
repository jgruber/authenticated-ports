{% extends "base.html" %}
{% block title %}Sign in · authenticated-ports{% endblock %}
{% block content %}
<div class="rounded-xl bg-white dark:bg-slate-800 shadow p-6 sm:p-8">
  <h1 class="text-xl font-semibold mb-1">Sign in</h1>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
    Authenticate to open port forwards on demand.
  </p>
  <form method="post" action="{{ url_for('login') }}" class="space-y-4" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div>
      <label for="username" class="block text-sm font-medium mb-1">Username</label>
      <input id="username" name="username" type="text" required autofocus
             autocomplete="username" inputmode="text" value="{{ username }}"
             class="w-full rounded-md border border-slate-300 dark:border-slate-600
                    bg-white dark:bg-slate-900 px-3 py-2
                    focus:outline-none focus:ring-2 focus:ring-sky-500">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Password</label>
      <input id="password" name="password" type="password" required
             autocomplete="current-password"
             class="w-full rounded-md border border-slate-300 dark:border-slate-600
                    bg-white dark:bg-slate-900 px-3 py-2
                    focus:outline-none focus:ring-2 focus:ring-sky-500">
    </div>
    <button type="submit"
            class="w-full rounded-md bg-sky-600 hover:bg-sky-700 active:bg-sky-800
                   text-white font-medium py-2.5 transition">
      Sign in
    </button>
  </form>
</div>
{% endblock %}
